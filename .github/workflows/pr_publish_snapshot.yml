name: Publish PR snapshot

on:
  workflow_run:
    workflows: [ "Pull request checks" ]
    types: [ completed ]

concurrency:
  group: pr-snapshot-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# Fork PRs are gated by the repository setting "Require approval for all outside collaborators",
# which holds the "Pull request checks" run itself. Since publishing requires that run to have
# concluded successfully, no unapproved fork code ever reaches the Sonatype token.
jobs:
  # Without this a held or long-running publish shows the contributor nothing on the PR.
  notify_pending:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      statuses: write

    steps:
      - name: Mark snapshot publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="snapshot publish" \
            -f description="Publishing ${HEAD_SHA:0:7}-SNAPSHOT" \
            -f target_url="$RUN_URL"

  publish:
    runs-on: ubuntu-latest
    # conclusion == 'success' is the gate: held fork runs conclude as 'action_required'.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read

    steps:
      # head_sha/head_repository rather than pull_requests[0] - that array is empty for forked PRs.
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # No signing* vars: signing.required is false for -SNAPSHOT, so signMavenPublication skips.
      # SNAPSHOT_SHA is required - GITHUB_SHA here is the default branch head, not the PR commit.
      - name: Publish snapshot
        run: ./gradlew publishToMavenCentral --parallel
        env:
          SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_PASS }}

  # Separate job so the one running fork code never holds statuses: write.
  report:
    runs-on: ubuntu-latest
    needs: publish
    if: >-
      ${{ always()
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request' }}
    permissions:
      statuses: write

    steps:
      - name: Report snapshot publish result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$RESULT" = success ]; then
            state=success
            desc="Published ${HEAD_SHA:0:7}-SNAPSHOT"
          else
            state=failure
            desc="Snapshot publish $RESULT"
          fi
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="snapshot publish" \
            -f description="$desc" \
            -f target_url="$RUN_URL"
