name: Test report

on:
  workflow_run:
    workflows: [ "Pull request checks" ]
    types: [ completed ]

permissions: {}

# dorny/test-reporter publishes results as a check run, which requires checks: write.
# A pull_request run from a fork always gets a read-only GITHUB_TOKEN, regardless of the
# permissions block, so reporting from pull_request.yml would fail for every fork PR.
# Instead, pull_request.yml uploads the JUnit XML as the "test-results" artifact, and this
# workflow_run job, which runs in the base repository context with a writable token,
# downloads it and publishes the report against the PR head commit.
jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'action_required'
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      # Only consumes the XML artifact; no code from the PR is checked out or executed.
      - name: Publish test report
        uses: dorny/test-reporter@v2
        with:
          artifact: test-results
          name: Test results
          path: '**/*.xml'
          reporter: java-junit
          fail-on-empty: false
