name: Main pipeline

on:
  push:
    branches: [ main ]

jobs:
  build_main:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build project
        run: ./gradlew build

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Test results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
          fail-on-empty: false
          use-actions-summary: false # default true writes the job summary instead of creating a check run

      - name: dependency graph
        uses: gradle/actions/dependency-submission@v3
