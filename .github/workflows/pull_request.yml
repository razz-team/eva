name: Pull request checks

on:
  pull_request:
    branches: [ main ]

defaults:
  run:
    shell: bash

jobs:
  build_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build project
        run: ./gradlew build --parallel
